<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEMO — Financial Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F5454;
    --forest-dark:#123434;
    --teal:#11ABAB;
    --mint:#7BDADA;
    --red:#C0392B;
    --green:#117A45;
    --gold:#F0C058;
    --salmon:#F0A078;
    --cream:#F5ECE2;
    --bg:#F4F7F7;
    --card:#FFFFFF;
    --ink:#13302E;
    --sub:#5C7876;
    --border:#E3ECEC;
    --shadow: 0 10px 30px rgba(19,48,46,.08);
    --shadow-hover: 0 20px 45px rgba(17,171,171,.22);
  }
  body.dark{
    --bg:#0E2323;
    --card:#153A3A;
    --ink:#EAF5F5;
    --sub:#9FC4C2;
    --border:#1F4C4C;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --shadow-hover: 0 20px 45px rgba(17,171,171,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    transition:background .35s ease, color .35s ease;
  }
  .sidebar{
    width:44px;
    min-height:100vh;
    background:linear-gradient(180deg,var(--teal),var(--forest));
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .sidebar span{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    color:#fff;
    letter-spacing:.28em;
    font-size:11px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    opacity:.92;
    white-space:nowrap;
  }
  .main{
    flex:1;
    padding:48px 56px 32px;
    max-width:1180px;
    margin:0 auto;
    width:100%;
  }
  header.top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:8px;
  }
  .title-block h1{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:44px;
    margin:0;
    color:var(--forest);
    letter-spacing:-.5px;
  }
  body.dark .title-block h1{color:#EAF5F5;}
  .title-block h1 span{color:var(--teal);}
  .title-block p{
    margin:8px 0 0;
    font-size:13px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--sub);
  }
  .top-actions{display:flex; align-items:center; gap:10px;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--cream);
    color:var(--forest);
    font-size:12px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
  }
  body.dark .badge{background:#1F4C4C; color:#EAF5F5;}
  .icon-btn{
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    transition:transform .2s ease, box-shadow .2s ease;
    color:var(--ink);
  }
  .icon-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow);}

  .divider{
    height:1px;
    background:var(--border);
    margin:28px 0 36px;
  }

  .section-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 18px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:26px;
  }
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }

  .card{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:190px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px 26px;
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s cubic-bezier(.2,.8,.2,1), border-color .35s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover{
    transform:translateY(-8px);
    box-shadow:var(--shadow-hover);
    border-color:var(--teal);
  }
  .card:hover::before{transform:scaleX(1);}
  .card:hover .go-arrow{transform:translateX(4px);}

  .logo-tile{
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .logo-tile img{
    height:100%;
    width:auto;
    max-width:100%;
    display:block;
  }
  .card:hover .logo-tile{transform:scale(1.06);}

  .card h2{
    font-family:'Poppins',sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 4px;
    color:var(--forest);
  }
  body.dark .card h2{color:#EAF5F5;}
  .card h2 b{color:var(--teal);}
  .card p.desc{
    margin:0 0 6px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--sub);
  }
  .card p.tag{
    margin:0 0 22px;
    font-size:14px;
    color:var(--sub);
    line-height:1.5;
  }
  .card .go{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    font-weight:700;
    color:var(--teal);
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .go-arrow{display:inline-block; transition:transform .3s ease;}

  .vcn{ --accent-a:#005A5A; --accent-b:#00C864; --accent-bg:#E4F6F6; }
  .lto{ --accent-a:#005A5A; --accent-b:#DCBE78; --accent-bg:#FBF0DD; }
  .dae{ --accent-a:#005A5A; --accent-b:#FA8CA0; --accent-bg:#FBE7DD; }
  .ev{ --accent-a:#005A5A; --accent-b:#11ABAB; --accent-bg:#E4F6F6; }
  body.dark .ev{ --accent-bg:#0E3838; }
  body.dark .vcn{ --accent-bg:#0E3838; }
  body.dark .lto{ --accent-bg:#3A3020; }
  body.dark .dae{ --accent-bg:#3A2620; }

  footer{
    margin-top:44px;
    padding-top:20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    font-size:12px;
    color:var(--sub);
  }
  footer b{color:var(--forest);}
  body.dark footer b{color:#EAF5F5;}

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both;}
  .card:nth-child(1){animation-delay:.05s;}
  .card:nth-child(2){animation-delay:.15s;}
  .card:nth-child(3){animation-delay:.25s;}
  .title-block{animation:fadeUp .5s ease both;}
</style>
</head>
<body>

  <div class="sidebar"><span>VEMO MONTHLY FINANCIAL REVIEW</span></div>

  <div class="main">
    <header class="top">
      <div class="title-block">
        <h1>VEMO — <span>Financial Hub</span></h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" title="Dark/light mode">🌙</button>
      </div>
    </header>

    <div class="divider"></div>

    <p class="section-label">Business units</p>

    <div class="grid">

      <a class="card vcn" href="https://vemo-fp-a.github.io/VCN_BoardD/" target="_self">
        <div class="logo-tile"><img src="logos/vcn.png" alt="VCN — VEMO Charging"></div>
      </a>

      <a class="card lto" href="https://vemo-fp-a.github.io/LTO_BoardD/" target="_self">
        <div class="logo-tile"><img src="logos/lto.png?v=3" alt="LTO — VEMO Impulso"></div>
      </a>

      <a class="card dae" href="https://vemo-fp-a.github.io/DAE_BoardD/" target="_self">
        <div class="logo-tile"><img src="logos/dae.png" alt="DAE — VEMO Conduce"></div>
      </a>

      <a class="card ev" href="https://vemo-fp-a.github.io/EV_BoardD/" target="_self">
        <div class="logo-tile"><img src="logos/ev.png" alt="EV — FLEETS"></div>
      </a>
      
    </div>

    <footer>
      <div><b>VEMO</b></div>
      <div>Strictly Private &amp; Confidential</div>
    </footer>

    <div id="vemo-hero-3d-wrap"
         style="position:relative;height:320px;margin:32px 0 8px;border-radius:20px;overflow:hidden;">
      <vemo-hero-3d style="display:block;width:100%;height:320px;"></vemo-hero-3d>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const WORD       = 'VEMO';
const COLOR_FACE = 0x0f8f7f;   // verde oscuro VEMO (cara frontal)
const COLOR_SIDE = 0x00c26b;   // verde brillante (extrusión)
const COLOR_RING = 0x12a0a0;   // teal (anillo)

class VemoHero3D extends HTMLElement {
  connectedCallback() {
    if (this._started) return;
    this._started = true;
    const host = this;
    const w = () => host.clientWidth  || 900;
    const h = () => host.clientHeight || 320;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w(), h());
    renderer.domElement.style.display = 'block';
    host.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, w() / h(), 0.1, 100);
    camera.position.set(0, 0.6, 14);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(4, 6, 8);  scene.add(key);
    const rim = new THREE.DirectionalLight(0x8fe9c6, 1.1); rim.position.set(-6, -2, 4); scene.add(rim);
    const pt  = new THREE.PointLight(COLOR_RING, 18, 30);  pt.position.set(-3, 2, 6);   scene.add(pt);

    const group = new THREE.Group(); scene.add(group);
    const faceMat = new THREE.MeshStandardMaterial({ color: COLOR_FACE, roughness: 0.28, metalness: 0.35 });
    const sideMat = new THREE.MeshStandardMaterial({ color: COLOR_SIDE, roughness: 0.45, metalness: 0.20 });

    new FontLoader().load(
      'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
      (font) => {
        const geo = new TextGeometry(WORD, {
          font, size: 2.6, height: 0.9, depth: 0.9, curveSegments: 12,
          bevelEnabled: true, bevelThickness: 0.09, bevelSize: 0.07, bevelSegments: 4
        });
        geo.computeBoundingBox();
        const bb = geo.boundingBox;
        geo.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, -(bb.max.z + bb.min.z) / 2);
        group.add(new THREE.Mesh(geo, [faceMat, sideMat]));

        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(4.6, 0.055, 12, 160),
          new THREE.MeshStandardMaterial({ color: COLOR_RING, roughness: 0.3, metalness: 0.6 })
        );
        ring.rotation.x = Math.PI / 2.35;
        group.add(ring);
      }
    );

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      group.rotation.y = t * 0.45;                 // autorrotación
      group.rotation.x = Math.sin(t * 0.5) * 0.11; // cabeceo suave
      group.position.y = Math.sin(t * 0.8) * 0.12; // flotación
      renderer.render(scene, camera);
    });

    new ResizeObserver(() => {
      renderer.setSize(w(), h());
      camera.aspect = w() / h();
      camera.updateProjectionMatrix();
    }).observe(host);
  }
}
if (!customElements.get('vemo-hero-3d')) customElements.define('vemo-hero-3d', VemoHero3D);
</script>

<script>
  const toggle = document.getElementById('themeToggle');
  const body = document.body;
  if(localStorage.getItem('vemo-hub-theme') === 'dark'){
    body.classList.add('dark');
    toggle.textContent = '☀️';
  }
  toggle.addEventListener('click', () => {
    body.classList.toggle('dark');
    const isDark = body.classList.contains('dark');
    toggle.textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('vemo-hub-theme', isDark ? 'dark' : 'light');
  });
</script>

</body>
</html>
